name: Build iOS (IPA)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI with 1 click

jobs:
  build-ios:
    name: Build iOS App (.ipa)
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          FIREBASE_PROJECT_ID=set-elkol
          FIREBASE_DB_URL=https://set-elkol-default-rtdb.firebaseio.com
          ADMIN_EMAIL=setelkol.support@gmail.com
          GOOGLE_MAPS_API_KEY=AIzaSyBSQU9laolanFJ20jWOkm1geVkwz2vsAsU
          INSTAPAY_ENABLED=true
          VODAFONE_CASH_ENABLED=true
          PAYMOB_API_KEY=placeholder
          PAYMOB_INTEGRATION_ID=placeholder
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Verify Code Quality
        run: |
          flutter analyze
          flutter test

      - name: Build iOS Application (Unsigned IPA)
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r SetElKol.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: set-elkol-ios-ipa
          path: build/ios/iphoneos/SetElKol.ipa
          retention-days: 14

      - name: Upload Runner.app (For Simulator / Direct testing)
        uses: actions/upload-artifact@v4
        with:
          name: set-elkol-runner-app
          path: build/ios/iphoneos/Runner.app
          retention-days: 14