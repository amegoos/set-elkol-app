name: set_elkol_app
description: "ست الكل — أكل بيتي من إيد ستات مصر"
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.5.6

  # State management
  flutter_riverpod: ^2.5.1
  hooks_riverpod: ^2.5.1
  flutter_hooks: ^0.20.5
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7
  app_links: ^6.4.1

  # Local storage
  shared_preferences: ^2.3.1
  hive_flutter: ^1.1.0

  # Environment
  flutter_dotenv: ^5.1.0

  # Images
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # Fonts
  google_fonts: ^6.2.1

  # Icons
  flutter_svg: ^2.0.10+1
  hugeicons: ^0.0.7

  # UI helpers
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  smooth_page_indicator: ^1.2.0+3
  intl: ^0.19.0
  timeago: ^3.7.0

  # Utility
  equatable: ^2.0.5
  dartz: ^0.10.1
  uuid: ^4.4.2
  url_launcher: ^6.3.0
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.4.3
  build_runner: ^2.4.11
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
    - assets/images/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf
